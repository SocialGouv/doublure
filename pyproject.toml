[project]
# Distribution name; the import namespace stays `anonproxy`, because the state
# directory and the environment variables derive from it and renaming them
# would orphan every vault already written.
name = "doublure"
version = "0.1.0"
description = "Bidirectional pseudonymisation proxy between Claude Code and the Anthropic API"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.4",
    "httpx>=0.28.1",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonproxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Évite un bloc `sys.path.insert` (et son cortège de `# noqa: E402`) en tête de
# chaque fichier de test. `.` donne accès à anthropic_walker.py, à la racine.
pythonpath = [".", "src"]
